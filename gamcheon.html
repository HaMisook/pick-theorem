<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감천문화마을 지도 겹쳐 보기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#ffffff;--fg:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--panel:rgba(255,255,255,.94)}
html,body{height:100%;margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--fg);background:var(--bg)}
#map{position:absolute;inset:0}
#panel{position:absolute;top:10px;right:10px;z-index:1000;width:min(300px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:14px}
#panel h1{font-size:16px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{width:64px;color:var(--muted);flex:none}
.row input[type=range]{flex:1;min-width:0}
.row output{width:56px;text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button,.filebtn{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--fg);cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.filebtn input{display:none}
.hint{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5}
.leaflet-image-layer{transform-origin:center center}
#toggle{display:none}
@media (max-width:600px){#panel{top:auto;bottom:10px;right:10px;left:10px;width:auto}}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>감천문화마을 안내지도 겹쳐 보기</h1>
  <div class="row"><label for="op">투명도</label><input id="op" type="range" min="0" max="100" value="60"><output id="opv">60%</output></div>
  <div class="row"><label for="wd">가로 길이</label><input id="wd" type="range" min="200" max="2000" step="5" value="760"><output id="wdv">760 m</output></div>
  <div class="row"><label for="rt">회전</label><input id="rt" type="range" min="-180" max="180" step="0.5" value="0"><output id="rtv">0°</output></div>
  <div class="btns">
    <button id="drag">지도 그림 옮기기</button>
    <button id="base">일반 지도</button>
    <button id="hide">그림 숨기기</button>
    <button id="reset">처음으로</button>
    <label class="filebtn">다른 그림 불러오기<input id="file" type="file" accept="image/*"></label>
  </div>
  <div class="hint" id="hint">‘지도 그림 옮기기’를 켜고 끌면 그림이 움직입니다. 끄면 지도가 움직입니다. 위치·크기·회전은 이 기기에 저장됩니다.</div>
</div>

let ASPECT=429/502;
const DEF={lat:35.09760,lng:129.01060,w:760,rot:0,op:60};
let st=Object.assign({},DEF);
try{const s=JSON.parse(localStorage.getItem('gamcheon-overlay')||'null'); if(s) st=Object.assign(st,s);}catch(e){}
const map=L.map('map',{zoomControl:true,zoomSnap:0.25}).setView([st.lat,st.lng],16.5);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap contributors'});
sat.addTo(map);
L.control.scale({imperial:false}).addTo(map);
function bounds(){
  const R=6378137, dLat=(st.w*ASPECT/2)/R*180/Math.PI, dLng=(st.w/2)/(R*Math.cos(st.lat*Math.PI/180))*180/Math.PI;
  return [[st.lat-dLat,st.lng-dLng],[st.lat+dLat,st.lng+dLng]];
}
let ov=L.imageOverlay(IMG,bounds(),{opacity:st.op/100,interactive:false}).addTo(map);
function applyRot(){ const el=ov.getElement(); if(el){ el.style.rotate=st.rot+'deg'; } }
ov.on('load',applyRot); map.on('zoomend moveend viewreset',applyRot);
function render(){
  ov.setBounds(bounds()); ov.setOpacity(st.op/100); applyRot();
  op.value=st.op; opv.textContent=st.op+'%'; wd.value=st.w; wdv.textContent=st.w+' m'; rt.value=st.rot; rtv.textContent=st.rot+'°';
  try{localStorage.setItem('gamcheon-overlay',JSON.stringify(st));}catch(e){}
}
op.oninput=e=>{st.op=+e.target.value;render()};
wd.oninput=e=>{st.w=+e.target.value;render()};
rt.oninput=e=>{st.rot=+e.target.value;render()};
let dragMode=false, dragging=false, last=null;
drag.onclick=()=>{dragMode=!dragMode; drag.classList.toggle('on',dragMode); if(dragMode) map.dragging.disable(); else map.dragging.enable(); map.getContainer().style.cursor=dragMode?'move':'';};
const c=map.getContainer();
c.addEventListener('pointerdown',e=>{if(!dragMode)return; dragging=true; last=map.mouseEventToLatLng(e); c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(!dragging)return; const p=map.mouseEventToLatLng(e); st.lat+=p.lat-last.lat; st.lng+=p.lng-last.lng; last=p; render();});
c.addEventListener('pointerup',()=>{dragging=false}); c.addEventListener('pointercancel',()=>{dragging=false});
let isSat=true;
base.onclick=()=>{isSat=!isSat; if(isSat){map.removeLayer(osm);sat.addTo(map);base.textContent='일반 지도';}else{map.removeLayer(sat);osm.addTo(map);base.textContent='위성 사진';} ov.bringToFront(); applyRot();};
let hidden=false;
hide.onclick=()=>{hidden=!hidden; ov.setOpacity(hidden?0:st.op/100); hide.textContent=hidden?'그림 보이기':'그림 숨기기'; hide.classList.toggle('on',hidden);};
reset.onclick=()=>{st=Object.assign({},DEF); hidden=false; hide.textContent='그림 숨기기'; hide.classList.remove('on'); map.setView([st.lat,st.lng],16.5); render();};
file.onchange=e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{const im=new Image(); im.onload=()=>{ASPECT=im.height/im.width; map.removeLayer(ov); ov=L.imageOverlay(r.result,bounds(),{opacity:st.op/100,interactive:false}).addTo(map); ov.on('load',applyRot); render();}; im.src=r.result;}; r.readAsDataURL(f);};
